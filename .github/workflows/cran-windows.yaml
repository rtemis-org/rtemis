# Runs the CRAN Windows check (win-builder R-devel) on a GitHub Windows runner:
# R CMD check --as-cran on the built tarball, with CI, NOT_CRAN, and the
# RTEMIS_* test switches unset, so tests skip what they skip on CRAN and
# run_test_group() lists each test that takes at least 2 s. The step summary
# reports the check's elapsed time, its timed stages, and the slowest examples
# and tests (tools/check-timing.R); the check directory is uploaded.
#
# As on win-builder, dependencies come from CRAN (and Bioconductor), and the
# check builds the PDF manual with TinyTeX. GitHub Windows runners differ in
# hardware and load from win-builder, so times compare between runs of this
# workflow, not one to one with CRAN.

on:
  workflow_dispatch:
    inputs:
      r-version:
        description: R version
        type: choice
        options: [devel, release]
        default: devel

name: cran-windows

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: cran-windows-${{ github.ref }}-${{ inputs.r-version }}
  cancel-in-progress: true

jobs:
  check:
    name: R CMD check --as-cran (Windows, R ${{ inputs.r-version }})
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      # R CMD check --as-cran checks README.md and NEWS.md with pandoc.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          cache: always
      # makeindex builds the manual's index and is outside the TinyTeX-1
      # package list.
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install LaTeX packages for the manual
        run: |
          tlmgr update --self
          tlmgr install makeindex
      # As devtools::build(), which check_win_devel() calls, the tarball
      # carries no prebuilt manual; the check builds it.
      - name: Build
        shell: bash
        run: R CMD build --no-manual .
      # _R_CHECK_TIMINGS_=0 reports the time of every timed stage;
      # --as-cran reports only those of 10 s or more.
      - name: Check as CRAN
        id: check
        shell: bash
        timeout-minutes: 90
        run: |
          start=$SECONDS
          set +e
          env -u CI -u NOT_CRAN -u GITHUB_PAT \
            -u RTEMIS_TEST_GROUP -u RTEMIS_RUN_PARALLEL_TESTS \
            _R_CHECK_TIMINGS_=0 \
            sh -c 'env | grep -E "^(CI|NOT_CRAN|RTEMIS_|_R_)" | sort; R CMD check --as-cran --timings rtemis_*.tar.gz'
          status=$?
          echo "elapsed=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Summarize timings
        if: ${{ always() }}
        shell: bash
        env:
          ELAPSED: ${{ steps.check.outputs.elapsed }}
        run: Rscript tools/check-timing.R rtemis.Rcheck "$ELAPSED" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cran-windows-${{ inputs.r-version }}
          path: |
            rtemis.Rcheck
            !rtemis.Rcheck/rtemis
            !rtemis.Rcheck/00_pkg_src
          if-no-files-found: ignore
