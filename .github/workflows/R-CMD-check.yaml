# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-parallel-tests:
        description: Run parallel worker integration tests
        type: boolean
        default: false

name: R-CMD-check

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: R-CMD-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: R-CMD-check (${{ matrix.test-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        test-group: [general, supervised, fitting]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RTEMIS_TEST_GROUP: ${{ matrix.test-group }}
      RTEMIS_RUN_PARALLEL_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run-parallel-tests && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://rtemis-org.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: always
          cache-version: 5
      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: 25
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          args: ${{ matrix.test-group == 'general' && 'c("--no-manual", "--as-cran")' || 'c("--no-manual", "--as-cran", "--no-examples")' }}
          error-on: '"note"'
      - name: Show partial test output
        if: ${{ failure() || cancelled() }}
        run: find check -name 'testthat.Rout*' -exec tail -n 150 '{}' \;
      - name: Preserve check diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: check-diagnostics-${{ matrix.test-group }}
          path: check
          if-no-files-found: ignore

  R-CMD-check:
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test group
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
